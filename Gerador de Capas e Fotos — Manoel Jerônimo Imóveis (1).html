<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Gerador de Capas e Fotos — Manoel Jerônimo Imóveis</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f5f5f3;--card:#fff;--tx:#1a1a1a;--mu:#6b6b6b;--bd:#e4e4e0;--rd:#d6141f;--rd2:#b10f18;--in:#fafaf8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141414;--card:#1f1f1f;--tx:#f2f2f2;--mu:#a0a0a0;--bd:#333;--in:#262626;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Montserrat,Arial,sans-serif}
header{background:var(--card);border-bottom:3px solid var(--rd);padding:12px 20px;display:flex;align-items:center;gap:12px}
header img{height:42px}header b{font-size:18px;display:block}header small{color:var(--mu)}
main{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:18px;padding:18px;max-width:1400px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--rd);margin:0 0 12px}
label{display:block;font-size:13px;font-weight:500;margin:10px 0 4px}
input[type=text],select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chk{display:flex;gap:8px;align-items:center;margin:10px 0 0;font-weight:500}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--rd);color:#fff}
button:hover{background:var(--rd2)}button.s{background:var(--in);color:var(--tx);border:1px solid var(--bd)}button.s:hover{border-color:var(--rd)}
button:disabled{opacity:.45;cursor:not-allowed}button.big{width:100%;padding:14px;font-size:15px}
.drop{display:block;border:2px dashed var(--bd);border-radius:10px;padding:14px;text-align:center;color:var(--mu);cursor:pointer;margin:0}
.drop:hover{border-color:var(--rd)}.drop input{display:none}
.grid3{display:grid;grid-template-columns:repeat(3,38px);gap:4px}.grid3 i{height:38px;border:1px solid var(--bd);border-radius:6px;background:var(--in);cursor:pointer}.grid3 i.on{background:var(--rd);border-color:var(--rd)}
.btns{display:grid;gap:8px;margin-top:10px}
#cv{width:100%;border-radius:10px;border:1px solid var(--bd);display:block}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ph{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--in)}.ph canvas{width:100%;display:block;background:#ccc}
.ph div{display:flex;gap:4px;padding:6px;align-items:center}.ph span{flex:1;font-size:12px;font-weight:700}.ph button{padding:5px 8px;font-size:13px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:10px;display:none}.bar i{display:block;height:100%;width:0;background:var(--rd);transition:width .15s}
#msg{font-size:13px;margin-top:8px;min-height:18px}.ok{color:#1a8a3c}.err{color:var(--rd)}
.cnt{float:right;color:var(--mu);font-weight:700;text-transform:none;letter-spacing:0}
</style></head><body>

9PbhZ4H0VXTkiPTTDISiKIqiKIqiqNj1NxuwOxPDbv36AAAAAElFTkSuQmCC" alt=""><div><b>Manoel Jerônimo Imóveis</b><small>Gerador de capas e fotos com marca-d’água</small></div></header>
<main>
<section>
 <div class="card"><h2>1 · Dados do imóvel</h2>
  <label>Código do imóvel</label><input type="text" id="code" placeholder="Ex.: 5646">
  <div class="row"><div><label>Tipo de anúncio</label><select id="ad"><option>Venda</option><option selected>Locação</option><option>Venda e Locação</option></select></div>
  <div><label>Tipo de imóvel</label><select id="type"><option>Casa</option><option>Apartamento</option><option>Terreno</option><option>Comercial</option><option>Chácara</option><option>Sítio</option><option>Fazenda</option></select></div></div>
  <label>Bairro</label><input type="text" id="bairro" placeholder="Ex.: Jardim São Francisco"></div>
 <div class="card"><h2>2 · Capa</h2>
  <label class="drop"><input type="file" id="fc" accept="image/jpeg,image/png,image/webp">📷 Enviar foto principal</label>
  <div class="chk"><input type="checkbox" id="mancha" checked><span>Mancha gráfica</span></div>
  <div class="chk"><input type="checkbox" id="showcode" checked><span>Exibir código do imóvel</span></div>
  <div class="btns"><button class="s" id="dlcover">⬇ Baixar somente a capa (PNG 1080×1080)</button></div></div>
 <div class="card"><h2>3 · Fotos com marca-d’água <span class="cnt" id="cnt">0/9</span></h2>
  <label class="drop"><input type="file" id="fp" accept="image/jpeg,image/png,image/webp" multiple>🖼 Selecionar até 9 fotos (JPG, PNG, WEBP)</label>
  <label>Posição</label><div class="grid3" id="pos"></div>
  <div class="row"><div><label>Tamanho</label><select id="sz"><option value="s">Pequeno</option><option value="m" selected>Médio</option><option value="l">Grande</option></select></div>
  <div><label>Opacidade: <span id="opv">60</span>%</label><input type="range" id="op" min="5" max="100" value="60" style="width:100%"></div></div></div>
 <div class="card"><h2>4 · Download</h2>
  <button class="big" id="dlall">BAIXAR MATERIAL COMPLETO (ZIP)</button>
  <div class="btns"><button class="s" id="dlph">⬇ Somente as fotos com marca-d’água (ZIP)</button></div>
  <div class="bar" id="bar"><i id="bi"></i></div><div id="msg"></div></div>
</section>
<section><div class="card"><h2>Pré-visualização da capa</h2><canvas id="cv" width="1080" height="1080"></canvas></div>
<div class="card"><h2>Galeria com marca-d’água</h2><div class="gal" id="gal"></div><p id="emp" style="color:var(--mu)">Nenhuma foto enviada ainda.</p></div></section>
</main>
<script>
const $=s=>document.querySelector(s),LOGO=new Image,WM=new Image;
const S={cover:null,mancha:true,showCode:true,photos:[],pos:'c',busy:false};let uid=0,tm;
const POS=['tl','tc','tr','cl','c','cr','bl','bc','br'],SZ={s:.18,m:.26,l:.40};
function msg(t,c){const m=$('#msg');m.textContent=t;m.className=c||'';}
function load(file){return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),i=new Image;i.onload=()=>ok({img:i,url:u,name:file.name});i.onerror=()=>{URL.revokeObjectURL(u);ko(new Error(file.name))};i.src=u;});}
const okType=f=>/^image\/(jpeg|png|webp)$/.test(f.type);
const toBlob=(c,t,q)=>new Promise((ok,ko)=>c.toBlob(b=>b?ok(b):ko(new Error('Falha ao gerar imagem')),t,q));
function rr(x,a,b,c,d,r){x.beginPath();x.roundRect(a,b,c,d,r);}
function drawCover(){
 const c=$('#cv'),x=c.getContext('2d'),W=1080;x.clearRect(0,0,W,W);x.fillStyle='#fff';x.fillRect(0,0,W,W);
 const code=$('#code').value.trim(),ad=$('#ad').value,ty=$('#type').value,ba=$('#bairro').value.trim();
 const px=0,py=130,pw=W,ph=860;x.save();x.beginPath();x.rect(px,py,pw,ph);x.clip();
 if(S.cover){const i=S.cover.img,k=Math.max(pw/i.width,ph/i.height),w=i.width*k,h=i.height*k;x.drawImage(i,px+(pw-w)/2,py+(ph-h)/2,w,h);}
 else{x.fillStyle='#d9d9d6';x.fillRect(px,py,pw,ph);x.fillStyle='#888';x.font='500 34px Montserrat,Arial';x.textAlign='center';x.fillText('Envie a foto principal do imóvel',W/2,py+ph/2);}
 if(S.mancha){const g=x.createRadialGradient(0,990,0,0,990,720);g.addColorStop(0,'rgba(255,255,255,.97)');g.addColorStop(.45,'rgba(255,255,255,.82)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(px,py,pw,ph);}
 x.restore();x.textAlign='left';
 if(LOGO.complete&&LOGO.naturalWidth)x.drawImage(LOGO,45,14,87,100);
 x.fillStyle='#111';x.font='700 32px Montserrat,Arial';x.fillText('Manoel Jerônimo',150,62);x.fillStyle='#666';x.font='400 21px Montserrat,Arial';x.fillText('Corretor de imóveis',150,92);
 if(S.showCode&&code){x.fillStyle='#d6141f';rr(x,830,150,270,92,16);x.fill();x.fillStyle='#fff';x.textAlign='center';x.font='700 19px Montserrat,Arial';x.fillText('CÓD. DO IMÓVEL',955,184);x.font='800 34px Montserrat,Arial';x.fillText(code,955,226);x.textAlign='left';}
 x.fillStyle='#d6141f';x.font='800 40px Montserrat,Arial';x.fillText(ad.toUpperCase(),40,748);
 x.fillStyle='#111';x.font='800 84px Montserrat,Arial';x.fillText(ty.toUpperCase(),40,838);
 x.fillStyle='#d6141f';x.fillRect(40,860,230,3);
 if(ba){x.beginPath();x.arc(56,908,14,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(56,908,5,0,7);x.fill();x.fillStyle='#111';x.font='500 38px Montserrat,Arial';x.fillText(ba,84,920);}
 x.fillStyle='#fff';x.fillRect(0,990,W,78);x.fillStyle='#111';x.fillRect(360,1000,2,58);x.fillRect(720,1000,2,58);
 [['(19) 99303-0194',180,'700 28px'],['mjeronimoimoveis.com.br',540,'700 23px'],['CRECISP: 278536F',900,'700 26px']].forEach(([t,cx,f])=>{x.font=f+' Montserrat,Arial';const w=x.measureText(t).width;x.fillStyle='#d6141f';x.beginPath();x.arc(cx-w/2-22,1029,9,0,7);x.fill();x.fillStyle='#111';x.textAlign='left';x.fillText(t,cx-w/2,1039);});
 x.fillStyle='#d6141f';x.fillRect(0,1068,W,12);
}
function drawWM(x,w,h){if(!WM.naturalWidth)return;const m=Math.min(w,h),ww=SZ[$('#sz').value]*m,wh=ww*WM.naturalHeight/WM.naturalWidth,g=.03*m,p=S.pos;
 const X=p[1]=='l'||p[0]=='l'?g:0;let cx,cy;const col=p=='c'?'c':p[1]||p[0],row=p=='c'?'c':p[0];
 const L=g,R=w-ww-g,C=(w-ww)/2;const col2={tl:L,cl:L,bl:L,tc:C,c:C,bc:C,tr:R,cr:R,br:R}[p],row2={tl:g,tc:g,tr:g,cl:(h-wh)/2,c:(h-wh)/2,cr:(h-wh)/2,bl:h-wh-g,bc:h-wh-g,br:h-wh-g}[p];
 x.save();x.globalAlpha=$('#op').value/100;x.drawImage(WM,col2,row2,ww,wh);x.restore();}
function renderPhoto(i,max){const k=max?Math.min(1,max/Math.max(i.width,i.height)):1,c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(i,0,0,c.width,c.height);drawWM(x,c.width,c.height);return c;}
function gallery(){
 $('#cnt').textContent=S.photos.length+'/9';$('#emp').style.display=S.photos.length?'none':'block';const g=$('#gal');g.innerHTML='';
 S.photos.forEach((p,n)=>{const d=document.createElement('div');d.className='ph';d.appendChild(renderPhoto(p.img,480));
  const b=document.createElement('div'),l=document.createElement('span');l.textContent='Foto '+String(n+1).padStart(2,'0');b.appendChild(l);
  [['◀','Mover para antes',()=>mv(n,-1),n==0],['▶','Mover para depois',()=>mv(n,1),n==S.photos.length-1],['⟳','Substituir',()=>rep(n)],['⬇','Baixar esta foto',()=>one(n)],['✕','Excluir',()=>del(n)]].forEach(([t,ti,f,dis])=>{const e=document.createElement('button');e.className='s';e.textContent=t;e.title=ti;e.disabled=!!dis||S.busy;e.onclick=f;b.appendChild(e);});
  d.appendChild(b);g.appendChild(d);});
}
function mv(n,d){const a=S.photos;[a[n],a[n+d]]=[a[n+d],a[n]];gallery();}
function del(n){URL.revokeObjectURL(S.photos[n].url);S.photos.splice(n,1);gallery();}
function rep(n){const i=document.createElement('input');i.type='file';i.accept='image/jpeg,image/png,image/webp';i.onchange=async()=>{const f=i.files[0];if(!f)return;if(!okType(f))return msg('Formato não aceito. Use JPG, PNG ou WEBP.','err');try{const o=await load(f);URL.revokeObjectURL(S.photos[n].url);S.photos[n]=o;gallery();msg('Foto substituída.','ok');}catch(e){msg('Não foi possível abrir '+e.message,'err');}};i.click();}
async function addFiles(fs){const room=9-S.photos.length;fs=[...fs];if(!room)return msg('Limite de 9 fotos atingido.','err');const good=fs.filter(okType);let m='';if(good.length<fs.length)m='Alguns arquivos foram ignorados (formato não aceito). ';if(good.length>room)m+='Apenas as primeiras '+room+' foram adicionadas (limite 9). ';
 for(const f of good.slice(0,room)){try{S.photos.push(await load(f));}catch(e){m+='Erro ao abrir '+e.message+'. ';}}gallery();msg(m||'Fotos adicionadas.',m?'err':'ok');}
const code=()=>($('#code').value.trim().replace(/[^\w-]+/g,'')||'IMOVEL').toUpperCase();
async function save(name,blob){let d=null;try{if(window.claude&&window.claude.use)d=await window.claude.use('downloads');}catch(e){d=null;}
 if(!d){try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);msg('Download iniciado: '+name,'ok');return true;}catch(e){msg('Não foi possível baixar o arquivo: '+e.message,'err');return false;}}
 try{await d.save({filename:name,data:blob});msg('Arquivo pronto: '+name,'ok');return true;}catch(e){msg(e&&e.code=='declined'?'Download cancelado.':'Não foi possível salvar: '+(e&&e.message||e),'err');return false;}}
function busy(v,t){S.busy=v;document.querySelectorAll('button').forEach(b=>b.disabled=v);$('#bar').style.display=v?'block':'none';if(v){$('#bi').style.width='0';msg(t||'Preparando o material…');}else gallery();}
const prog=p=>{$('#bi').style.width=Math.round(p)+'%'};
async function coverBlob(){drawCover();return toBlob($('#cv'),'image/png');}
async function jpg(n){return toBlob(renderPhoto(S.photos[n].img),'image/jpeg',.95);}
const fn=n=>code()+'-FOTO-'+String(n+1).padStart(2,'0')+'.jpg';
async function one(n){busy(true,'Processando foto…');try{await save(fn(n),await jpg(n));}catch(e){msg('Erro: '+e.message,'err');}busy(false,'');}
async function zip(withCover,withPh,name){
 if(withCover&&!S.cover&&!withPh)return msg('Envie a foto principal para gerar a capa.','err');
 if(withPh&&!S.photos.length&&!(withCover&&S.cover))return msg('Envie ao menos uma foto.','err');
 busy(true,'Seu material está sendo preparado… aguarde.');
 try{const z=new JSZip(),tot=(withCover&&S.cover?1:0)+(withPh?S.photos.length:0);let d=0;
  if(withCover&&S.cover){z.file(code()+'-CAPA.png',await coverBlob());prog(++d/tot*70);}
  if(withPh)for(let n=0;n<S.photos.length;n++){z.file(fn(n),await jpg(n));prog(++d/tot*70);await new Promise(r=>setTimeout(r));}
  const b=await z.generateAsync({type:'blob',compression:'STORE'},m=>prog(70+m.percent*.3));prog(100);
  busy(false);await save(code()+name,b);
 }catch(e){busy(false);msg('Erro ao gerar o ZIP: '+e.message,'err');}}
function redraw(){drawCover();cancelAnimationFrame(tm);tm=requestAnimationFrame(gallery);}
['code','ad','type','bairro','sz','op'].forEach(i=>$('#'+i).addEventListener('input',()=>{$('#opv').textContent=$('#op').value;redraw();}));
$('#mancha').onchange=e=>{S.mancha=e.target.checked;drawCover();};$('#showcode').onchange=e=>{S.showCode=e.target.checked;drawCover();};
$('#fc').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!okType(f))return msg('Formato não aceito. Use JPG, PNG ou WEBP.','err');try{const o=await load(f);if(S.cover)URL.revokeObjectURL(S.cover.url);S.cover=o;drawCover();msg('Foto da capa carregada.','ok');}catch(x){msg('Não foi possível abrir a imagem.','err');}};
$('#fp').onchange=e=>{addFiles(e.target.files);e.target.value='';};
$('#pos').innerHTML=POS.map(p=>'<i data-p="'+p+'" class="'+(p=='c'?'on':'')+'"></i>').join('');
$('#pos').onclick=e=>{const p=e.target.dataset.p;if(!p)return;S.pos=p;document.querySelectorAll('#pos i').forEach(i=>i.classList.toggle('on',i.dataset.p==p));gallery();};
$('#dlcover').onclick=()=>zip(false,false)||0;
$('#dlcover').onclick=async()=>{if(!S.cover)return msg('Envie a foto principal para gerar a capa.','err');busy(true,'Gerando capa…');try{const b=await coverBlob();busy(false);await save(code()+'-CAPA.png',b);}catch(e){busy(false);msg('Erro: '+e.message,'err');}};
$('#dlall').onclick=()=>zip(true,true,'-MATERIAL-COMPLETO.zip');$('#dlph').onclick=()=>zip(false,true,'-FOTOS.zip');
